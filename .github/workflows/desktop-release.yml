name: desktop-release

# PHASE-021 T12 — the Windows desktop release pipeline (MASTER-PLAN §8).
# Triggered by version tags (v1.0.0 semver or CalVer — the updater's
# compareSemver handles both). Pipeline order is structurally asserted by
# apps/desktop/__tests__/desktop-release-ci.test.ts (install → build:desktop
# → check:desktop-shell → cargo → sign → SBOM → upload → manifest publish).
#
# Honest scope notes (the sandbox ships this as code; it executes on real
# Windows runners only):
# - The Rust shell (apps/desktop/src-tauri) is compiled HERE exclusively —
#   the dev sandbox has no Rust toolchain (the k6 precedent).
# - SQLCipher (DR-P21-02 cipher profile) comes from the `sqlcipher` cargo
#   feature: rusqlite's bundled-sqlcipher-vendored-openssl compiles SQLCipher
#   + OpenSSL from source. windows-latest ships MSVC + Strawberry Perl (both
#   required); NASM is not needed (no-asm build). No vcpkg, no system
#   OpenSSL — the vendored path is hermetic.
# - Windows CODE SIGNING: EV certificates live on hardware tokens / HSMs, so
#   the runner never holds the raw key. The step below documents the seam:
#   set WINDOWS_CERT_THUMBPRINT (a cert imported into the runner's user store
#   by your signing infrastructure — e.g. an EV token agent on a self-hosted
#   runner, or Azure Trusted Signing with its own action) and signtool signs
#   + timestamps the installers. Without it the step warns and continues
#   (unsigned artifacts are fine for the internal channel, never for GA).
# - Updater signing is REAL minisign: the tauri CLI signs the nsis bundle
#   with TAURI_SIGNING_PRIVATE_KEY (S-15 secret) producing the .sig artifact;
#   the publish step verifies against UPDATE_SIGNING_PUBKEY before layout.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: pnpm

      - name: Release version from the tag (semver or CalVer — the updater compares both)
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # DR-P21-07 — the static export of the shell web subset (offline
      # console + unlock). The prebuild stashes server-only surfaces and
      # restores them after the build (abort-safe).
      - name: Desktop web export (build:desktop → apps/web/out-desktop)
        run: pnpm --filter @erp/web build:desktop

      # Structural gate: tauri.conf invariants + bridge↔command parity +
      # export completeness (offline/unlock present) + secret scan.
      - name: Shell structural gate (check:desktop-shell)
        run: pnpm check:desktop-shell

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Compile gate with the SQLCipher feature (DR-P21-02 cipher profile).
      - name: cargo build --release (SQLCipher feature)
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --features sqlcipher

      - name: Tauri CLI (v2)
        shell: bash
        run: cargo install tauri-cli --locked --version "^2"

      # Bundles nsis + msi, stamps the tag version, and — with
      # TAURI_SIGNING_PRIVATE_KEY set — produces the minisign .sig updater
      # artifacts (bundle.createUpdaterArtifacts).
      - name: Bundle + updater-sign (nsis + msi + minisign .sig)
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
        run: 'cargo tauri build --features sqlcipher --config "{\"version\": \"${RELEASE_VERSION}\"}"'

      - name: Code-sign the installers (EV certificate — documented placeholders)
        shell: pwsh
        run: |
          # EV keys never leave the token/HSM. Configure one of:
          #  a) WINDOWS_CERT_THUMBPRINT — the EV cert imported into the user
          #     store by your signing infrastructure (token agent on a
          #     self-hosted runner, or a cert-store sync step), or
          #  b) replace this step with your signing service's action
          #     (e.g. Azure Trusted Signing).
          $thumbprint = '${{ secrets.WINDOWS_CERT_THUMBPRINT }}'
          $installers = @(
            Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"
            Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/msi/*.msi"
          )
          if ($thumbprint -ne '') {
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $thumbprint @installers
          } else {
            Write-Output "::warning::Windows code signing skipped (WINDOWS_CERT_THUMBPRINT not configured) — artifacts are unsigned (internal channel only)"
          }

      # Software Bill of Materials for the npm dependency graph (the Rust
      # cargo-audit SBOM is a documented follow-up once the shell stabilizes).
      - name: SBOM (CycloneDX, npm dependency graph)
        shell: bash
        run: |
          mkdir -p desktop-release-artifacts
          pnpm dlx @cyclonedx/cyclonedx-npm --output-format JSON --output-file desktop-release-artifacts/sbom-npm.json

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p desktop-release-artifacts
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe desktop-release-artifacts/ 2>/dev/null || true
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.sig desktop-release-artifacts/ 2>/dev/null || true
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi desktop-release-artifacts/ 2>/dev/null || true
          ls -la desktop-release-artifacts/

      - name: Upload installer artifacts (nsis + msi + SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: erp-desktop-${{ env.RELEASE_VERSION }}
          path: desktop-release-artifacts/*
          if-no-files-found: error

      # The updater manifest layout (deploy/updater/README.md): assemble the
      # manifest (platforms.signature = the tauri-signer .sig over the nsis
      # bundle), verify it against the channel public key, publish the
      # immutable versioned dir + the mutable latest.json pointer, and print
      # the CDN runbook. Uploading to the CDN is the deploy step (documented
      # in deploy/updater/README.md) — this job produces the exact tree.
      - name: Assemble the updater manifest (version + tag + bundle signature)
        shell: bash
        env:
          UPDATE_SIGNING_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBKEY }}
        run: |
          mkdir -p desktop-updater
          sig_file=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*.sig | head -n 1)
          setup_exe=$(basename "$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)")
          signature=$(cat "$sig_file")
          cat > desktop-updater/manifest.json <<EOF
          {
            "version": "${RELEASE_VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": $(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$signature"),
                "url": "https://updates.erp.example/stable/${RELEASE_VERSION}/${setup_exe}"
              }
            },
            "rollout": { "stagePercent": 10, "cohortSeed": "staging" },
            "notes": "ERP Desktop ${RELEASE_VERSION} — staged rollout 10% (stable channel)."
          }
          EOF
          cp "$sig_file" desktop-updater/
          printf '%s\n' "$UPDATE_SIGNING_PUBKEY" > desktop-updater/verify.pubkey || true
          cat desktop-updater/manifest.json

      - name: Publish the updater manifest layout (updater-manifest.ts publish)
        shell: bash
        run: |
          pnpm tsx scripts/updater-manifest.ts publish \
            --channel stable \
            --version "$RELEASE_VERSION" \
            --artifacts-dir desktop-updater \
            --pubkey desktop-updater/verify.pubkey \
            --out desktop-updater-dist

      - name: Upload the updater manifest tree
        uses: actions/upload-artifact@v4
        with:
          name: erp-desktop-updater-${{ env.RELEASE_VERSION }}
          path: desktop-updater-dist/*
          if-no-files-found: error
